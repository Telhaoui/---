name: Build Manarat Algeria APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build
        
      - name: Install Capacitor Assets
        run: npm install --save-dev @capacitor/assets
        
      - name: Add Android platform
        run: npx cap add android
        
      - name: Generate Android assets
        run: npx capacitor-assets generate --android
        
      - name: Verify generated icon
        run: |
          echo "=== ORIGINAL ICON ==="
          file resources/icon.png
          sha256sum resources/icon.png

          echo "=== GENERATED ICON ==="
          file android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          sha256sum android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "=== GENERATED ROUND ICON ==="
          sha256sum android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Check Android Manifest icon
        run: |
          echo "=== ICON CONFIGURATION ==="
          grep -nE 'android:icon|android:roundIcon' android/app/src/main/AndroidManifest.xml || true
          echo "=== MANIFEST ==="
          cat android/app/src/main/AndroidManifest.xml
        
      - name: Check generated icons
        run: |
          find android/app/src/main/res -type f | grep -E 'mipmap|ic_launcher' || true
        
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manarat-Algeria-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
